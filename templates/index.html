<!doctype html>

<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta
      name="description"
      content="Zunit — a clean, fast, and universal unit converter for everyday measurements, scientific values, and more."
    />

    <meta name="theme-color" content="#242424" />

    <title>Zunit — Universal Unit Converter</title>

    <script>
      (() => {
        const savedTheme = localStorage.getItem("zunit-theme");

        if (
          savedTheme === "dark" ||
          (!savedTheme &&
            window.matchMedia("(prefers-color-scheme: dark)").matches)
        ) {
          document.documentElement.classList.add("dark");
        }
      })();
    </script>

    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='style.css') }}"
    />
  </head>

  <body>
    <main class="page">
      <!-- =====================================================
       HEADER
       ===================================================== -->

      <header class="site-header">
        <a href="/" class="brand" aria-label="Zunit home">
          <span class="brand-mark">Z</span>
          <span class="brand-name">Zunit</span>
        </a>

        <div class="header-actions">
          <!-- Source Code -->

          <a
            class="header-link"
            href="https://github.com/mdhzarif03/Zunit-Universal-Unit-Converter"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="View Zunit source code on GitHub"
          >
            <svg
              class="header-icon github-icon"
              viewBox="0 0 24 24"
              aria-hidden="true"
            >
              <path
                fill="currentColor"
                d="M12 .5C5.65.5.5 5.65.5 12c0 5.08 3.29 9.39 7.85 10.91.57.1.78-.25.78-.55
            0-.27-.01-1-.01-1.96-3.19.69-3.86-1.54-3.86-1.54-.52-1.33-1.28-1.69-1.28-1.69
            -1.04-.71.08-.7.08-.7 1.15.08 1.76 1.18 1.76 1.18 1.02 1.75 2.68 1.25
            3.33.96.1-.74.4-1.25.73-1.54-2.55-.29-5.23-1.28-5.23-5.69
            0-1.26.45-2.29 1.18-3.1-.12-.29-.51-1.47.11-3.06
            0 0 .96-.31 3.15 1.18A10.9 10.9 0 0 1 12 6.86c.97 0 1.94.13 2.85.38
            2.19-1.49 3.15-1.18 3.15-1.18.62 1.59.23 2.77.11 3.06
            .73.81 1.18 1.84 1.18 3.1 0 4.42-2.69 5.39-5.25 5.68
            .41.35.78 1.04.78 2.1 0 1.52-.01 2.75-.01 3.12
            0 .3.21.65.79.54C20.21 21.39 23.5 17.08 23.5 12
            23.5 5.65 18.35.5 12 .5Z"
              />
            </svg>

            <span>Source</span>
          </a>

          <span class="header-divider" aria-hidden="true"></span>

          <!-- Developer -->

          <a
            class="header-link"
            href="https://mhzarif.vercel.app/"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="Visit Muhammad Hasan Zarif's website"
          >
            <span class="developer-dot"></span>
            <span>Developer</span>
          </a>

          <span class="header-divider" aria-hidden="true"></span>

          <!-- Theme -->

          <button
            class="theme-toggle"
            id="theme-toggle"
            type="button"
            aria-label="Switch to dark mode"
            title="Switch theme"
          >
            <svg
              class="theme-icon sun-icon"
              viewBox="0 0 24 24"
              aria-hidden="true"
            >
              <circle cx="12" cy="12" r="4"></circle>
              <path d="M12 2v2"></path>
              <path d="M12 20v2"></path>
              <path d="m4.93 4.93 1.41 1.41"></path>
              <path d="m17.66 17.66 1.41 1.41"></path>
              <path d="M2 12h2"></path>
              <path d="M20 12h2"></path>
              <path d="m6.34 17.66-1.41 1.41"></path>
              <path d="m19.07 4.93-1.41 1.41"></path>
            </svg>

            <svg
              class="theme-icon moon-icon"
              viewBox="0 0 24 24"
              aria-hidden="true"
            >
              <path
                d="M21 12.79A9 9 0 1 1 11.21 3
            7 7 0 0 0 21 12.79Z"
              ></path>
            </svg>
          </button>
        </div>
      </header>

      <!-- =====================================================
       HERO
       ===================================================== -->

      <section class="hero">
        <p class="eyebrow">PRECISION, WITHOUT THE CLUTTER</p>

        <h1>
          Convert anything.
          <br />
          <span>Measure everything.</span>
        </h1>

        <p class="hero-copy">
          A simple, fast converter for everyday measurements, scientific values,
          and everything in between.
        </p>
      </section>

      <!-- =====================================================
       CONVERTER
       ===================================================== -->

      <section class="converter-card" aria-label="Unit converter">
        <!-- Measurement + Value -->

        <div class="converter-top">
          <div class="field category-field">
            <label for="category"> Measurement </label>

            <select id="category" aria-label="Measurement category"></select>
          </div>

          <div class="field value-field">
            <label for="value"> Value </label>

            <input
              type="number"
              id="value"
              value="1"
              step="any"
              inputmode="decimal"
              autocomplete="off"
              aria-label="Value to convert"
            />
          </div>
        </div>

        <!-- From + To -->

        <div class="conversion-row">
          <div class="field">
            <label for="from-unit"> From </label>

            <select id="from-unit" aria-label="Convert from"></select>
          </div>

          <button
            class="swap-button"
            id="swap-button"
            type="button"
            aria-label="Swap units"
            title="Swap units"
          >
            <span aria-hidden="true">↕</span>
          </button>

          <div class="field">
            <label for="to-unit"> To </label>

            <select id="to-unit" aria-label="Convert to"></select>
          </div>
        </div>

        <!-- Result -->

        <div class="result-panel" aria-live="polite" aria-atomic="true">
          <div class="result-label">Result</div>

          <div class="result-value" id="result">1</div>

          <div class="result-unit" id="result-unit">Meter</div>
        </div>
      </section>

      <!-- =====================================================
       QUICK INFORMATION
       ===================================================== -->

      <section class="quick-info" aria-label="Zunit information">
        <div class="info-item">
          <strong id="category-count"> 11 </strong>

          <span> categories </span>
        </div>

        <div class="info-divider" aria-hidden="true"></div>

        <div class="info-item">
          <strong> Any </strong>

          <span> direction </span>
        </div>

        <div class="info-divider" aria-hidden="true"></div>

        <div class="info-item">
          <strong> Live </strong>

          <span> conversion </span>
        </div>
      </section>
    </main>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
  </body>
</html>
