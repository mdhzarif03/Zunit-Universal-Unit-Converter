<!doctype html>

<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta
      name="description"
      content="Zunit — a universal unit converter for fast, precise conversions across everyday measurements."
    />

    <meta name="theme-color" content="#f4f3ef" />

    <title>Zunit — Universal Unit Converter</title>

    <!-- =====================================================
     THEME INITIALIZATION
     Prevents a flash of the wrong theme on page load.
     ===================================================== -->

    <script>
      (() => {
        try {
          const savedTheme = localStorage.getItem("zunit-theme");

          if (
            savedTheme === "dark" ||
            (!savedTheme &&
              window.matchMedia &&
              window.matchMedia("(prefers-color-scheme: dark)").matches)
          ) {
            document.documentElement.classList.add("dark");
          }
        } catch (error) {
          console.warn("Zunit: Theme initialization failed.", error);
        }
      })();
    </script>

    <!-- =====================================================
     VERCEL WEB ANALYTICS
     HTML / vanilla JS integration
     ===================================================== -->

    <script>
      window.va =
        window.va ||
        function () {
          (window.vaq = window.vaq || []).push(arguments);
        };
    </script>

    <script defer src="/_vercel/insights/script.js"></script>

    <!-- =====================================================
     STYLESHEET
     ===================================================== -->

    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='style.css') }}"
    />
  </head>

  <body>
    <main class="page">
      <!-- ===================================================
       HEADER
       =================================================== -->

      <header class="site-header">
        <a href="/" class="brand" aria-label="Zunit home">
          <span class="brand-mark">Z</span>
          <span class="brand-name">Zunit</span>
        </a>

        <div class="header-actions">
          <!-- GitHub / Source -->

          <a
            class="header-link"
            href="https://github.com/mdhzarif03/Zunit-Universal-Unit-Converter"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="View Zunit source code on GitHub"
          >
            <svg
              class="header-icon github-icon"
              viewBox="0 0 24 24"
              aria-hidden="true"
            >
              <path
                fill="currentColor"
                d="M12 .5C5.65.5.5 5.65.5 12c0 5.08 3.29 9.39 7.85 10.91.57.1.78-.25.78-.55

            -1.04-.71.08-.7.08-.7 1.15.08 1.76 1.18 1.76 1.18 1.02 1.75 2.68 1.25
            3.33.96.1-.74.4-1.25.73-1.54-2.55-.29-5.23-1.28-5.23-5.69
            0-1.26.45-2.29 1.18-3.1-.12-.29-.51-1.47.11-3.06
            0 0 .96-.31 3.15 1.18A10.9 10.9 0 0 1 12 6.86c.97 0 1.94.13 2.85.38
            2.19-1.49 3.15-1.18 3.15-1.18.62 1.59.23 2.77.11 3.06
            .73.81 1.18 1.84 1.18 3.1 0 4.42-2.69 5.39-5.25 5.68
            .41.35.78 1.04.78 2.1 0 1.52-.01 2.75-.01 3.12
            0 .3.21.65.79.54C20.21 21.39 23.5 17.08 23.5 12
            23.5 5.65 18.35.5 12 .5Z"
              />
            </svg>

            <span>Source</span>
          </a>

          <span class="header-divider" aria-hidden="true"></span>

          <!-- Developer -->

          <a
            class="header-link"
            href="https://mhzarif.vercel.app/"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="Visit Muhammad Hasan Zarif's website"
          >
            <span class="developer-dot" aria-hidden="true"></span>

            <span>Developer</span>
          </a>

          <span class="header-divider" aria-hidden="true"></span>

          <!-- Theme Toggle -->

          <button
            class="theme-toggle"
            id="theme-toggle"
            type="button"
            aria-label="Switch to dark mode"
            title="Switch to dark mode"
          >
            <!-- Sun -->

            <svg
              class="theme-icon sun-icon"
              viewBox="0 0 24 24"
              aria-hidden="true"
            >
              <circle cx="12" cy="12" r="4"></circle>

              <path d="M12 2v2"></path>
              <path d="M12 20v2"></path>

              <path d="m4.93 4.93 1.41 1.41"></path>

              <path d="m17.66 17.66 1.41 1.41"></path>

              <path d="M2 12h2"></path>
              <path d="M20 12h2"></path>

              <path d="m6.34 17.66-1.41 1.41"></path>

              <path d="m19.07 4.93-1.41 1.41"></path>
            </svg>

            <!-- Moon -->

            <svg
              class="theme-icon moon-icon"
              viewBox="0 0 24 24"
              aria-hidden="true"
            >
              <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79Z"></path>
            </svg>
          </button>
        </div>
      </header>

      <!-- ===================================================
       HERO
       =================================================== -->

      <section class="hero" aria-labelledby="hero-title">
        <p class="eyebrow">UNIVERSAL UNIT CONVERTER</p>

        <h1 id="hero-title">
          PRECISION,
          <span>WITHOUT THE CLUTTER.</span>
        </h1>

        <p class="hero-copy">
          Convert anything. Measure everything. A fast, straightforward
          converter built for everyday calculations.
        </p>
      </section>

      <!-- ===================================================
       CONVERTER
       =================================================== -->

      <section class="converter-card" aria-label="Unit converter">
        <!-- Category + Value -->

        <div class="converter-top">
          <div class="field">
            <label for="category"> Measurement </label>

            <select
              id="category"
              name="category"
              aria-label="Measurement category"
            >
              <option value="">Loading...</option>
            </select>
          </div>

          <div class="field">
            <label for="value"> Value </label>

            <input
              id="value"
              name="value"
              type="number"
              inputmode="decimal"
              step="any"
              placeholder="Enter a value"
              autocomplete="off"
              aria-label="Value to convert"
            />
          </div>
        </div>

        <!-- From / Swap / To -->

        <div class="conversion-row">
          <div class="field">
            <label for="from-unit"> From </label>

            <select id="from-unit" name="from-unit" aria-label="Convert from">
              <option value="">Loading...</option>
            </select>
          </div>

          <button
            class="swap-button"
            id="swap-button"
            type="button"
            aria-label="Swap units"
            title="Swap units"
          >
            <span aria-hidden="true"> ⇄ </span>
          </button>

          <div class="field">
            <label for="to-unit"> To </label>

            <select id="to-unit" name="to-unit" aria-label="Convert to">
              <option value="">Loading...</option>
            </select>
          </div>
        </div>

        <!-- Result -->

        <div class="result-panel" aria-live="polite" aria-atomic="true">
          <p class="result-label">Result</p>

          <p class="result-value" id="result">—</p>

          <p class="result-unit" id="result-unit">Select a unit</p>
        </div>
      </section>

      <!-- ===================================================
       QUICK INFO
       =================================================== -->

      <section class="quick-info" aria-label="Zunit information">
        <div class="info-item">
          <strong id="category-count"> — </strong>

          <span> categories </span>
        </div>

        <span class="info-divider" aria-hidden="true"></span>

        <div class="info-item">
          <strong> Any </strong>

          <span> direction </span>
        </div>

        <span class="info-divider" aria-hidden="true"></span>

        <div class="info-item">
          <strong> Live </strong>

          <span> conversion </span>
        </div>
      </section>
    </main>

    <!-- =====================================================
     JAVASCRIPT
     ===================================================== -->

    <script src="{{ url_for('static', filename='script.js') }}"></script>
  </body>
</html>
